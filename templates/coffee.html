<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ item.name }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>

    <header>
        <h1><a href="/" style="color:inherit;text-decoration:none;">Наша кафешка</a></h1>
        <nav>
            {% if current_user.is_authenticated %}
                <span>Привет, {{ current_user.username }}!</span>
                <a href="{{ url_for('logout') }}">Выйти</a>
            {% else %}
                <a href="{{ url_for('login') }}">Войти</a>
                <a href="{{ url_for('register') }}">Регистрация</a>
            {% endif %}
        </nav>
    </header>

    <section>
        <div class="menu-item" style="max-width:400px;">
            <h3>{{ item.name }}</h3>
            <p>{{ item.price }} грн.</p>
            <p>{{ item.description }}</p>
            <button data-id="{{ item.id }}" class="add-to-cart">В корзину</button>
        </div>
    </section>

    <footer>
        <p>Адрес: ул. Примерная, 1</p>
    </footer>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
