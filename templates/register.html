<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация — Кафешка</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
    <main>
        <h1>Регистрация</h1>
        {% with messages = get_flashed_messages() %}
            {% if messages %}
                <ul>
                    {% for message in messages %}<li>{{ message }}</li>{% endfor %}
                </ul>
            {% endif %}
        {% endwith %}
        <form method="post">
            <label>Имя пользователя <input name="username" required autocomplete="username"></label>
            <label>Пароль <input type="password" name="password" required autocomplete="new-password"></label>
            <button type="submit">Зарегистрироваться</button>
        </form>
        <p><a href="{{ url_for('login') }}">Уже есть аккаунт? Войти</a></p>
        <p><a href="{{ url_for('home') }}">На главную</a></p>
    </main>
</body>
</html>
